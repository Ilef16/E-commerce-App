<div class="shell">
  <aside class="sidebar">
    <a routerLink="/" class="brand">
      <span class="mark">CM</span>
      <span>
        <strong>Plateforme</strong>
        <small>de vente en ligne</small>
      </span>
    </a>

    <nav>
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span>Bienvenue</span>
      <span class="env">Espace commercial</span>
    </header>
    <main>
      <router-outlet />
    </main>
  </div>
</div>
